[project]
name = "loreguard"
version = "0.1.0"
description = "Evidence-first narrative consistency review platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", ".artifacts", ".venv", "frontend"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/tasks.py"]
