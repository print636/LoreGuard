name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/loreguard-ci.db
      OPENAI_API_KEY: ""
      ENABLE_MODEL_EXTRACTION: "false"
      ENABLE_REVIEW_AGENT: "false"
      ENABLE_EMBEDDINGS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach
      - run: python3 scripts/run_compose_smoke.py --timeout-seconds 180
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  pg-axis-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: loreguard_test
          POSTGRES_USER: loreguard
          POSTGRES_PASSWORD: loreguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loreguard -d loreguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOREGUARD_TEST_POSTGRES_URL: postgresql+psycopg://loreguard:loreguard_test@127.0.0.1:5432/loreguard_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_pg_axis_direction_migration.py
  system-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/run_system_e2e.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-system-e2e
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
