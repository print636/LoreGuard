      ISSUE_EVIDENCE_REVIEW_REQUIRE_HYBRID: ${ISSUE_EVIDENCE_REVIEW_REQUIRE_HYBRID:-true}
      ENABLE_EVIDENCE_INVESTIGATOR: ${ENABLE_EVIDENCE_INVESTIGATOR:-false}
      EVIDENCE_INVESTIGATOR_MAX_SEEDS: ${EVIDENCE_INVESTIGATOR_MAX_SEEDS:-1}
      EVIDENCE_INVESTIGATOR_MAX_DECISION_ROUNDS: ${EVIDENCE_INVESTIGATOR_MAX_DECISION_ROUNDS:-6}
      EVIDENCE_INVESTIGATOR_MAX_TOOL_CALLS: ${EVIDENCE_INVESTIGATOR_MAX_TOOL_CALLS:-6}
      EVIDENCE_INVESTIGATOR_MAX_SEARCHES: ${EVIDENCE_INVESTIGATOR_MAX_SEARCHES:-2}
      EVIDENCE_INVESTIGATOR_MAX_READS: ${EVIDENCE_INVESTIGATOR_MAX_READS:-2}
      EVIDENCE_INVESTIGATOR_MAX_RESULTS: ${EVIDENCE_INVESTIGATOR_MAX_RESULTS:-12}
      EVIDENCE_INVESTIGATOR_MAX_READ_LINES: ${EVIDENCE_INVESTIGATOR_MAX_READ_LINES:-12}
      EVIDENCE_INVESTIGATOR_MAX_SPAN_CHARS: ${EVIDENCE_INVESTIGATOR_MAX_SPAN_CHARS:-12000}
      EVIDENCE_INVESTIGATOR_TOKEN_BUDGET: ${EVIDENCE_INVESTIGATOR_TOKEN_BUDGET:-16000}
      EVIDENCE_INVESTIGATOR_MAX_PROMPT_BYTES: ${EVIDENCE_INVESTIGATOR_MAX_PROMPT_BYTES:-131072}
      EVIDENCE_INVESTIGATOR_TIMEOUT_SECONDS: ${EVIDENCE_INVESTIGATOR_TIMEOUT_SECONDS:-30}
      EVIDENCE_INVESTIGATOR_TOTAL_DEADLINE_SECONDS: ${EVIDENCE_INVESTIGATOR_TOTAL_DEADLINE_SECONDS:-60}
      EVIDENCE_INVESTIGATOR_MAX_COMPLETION_TOKENS: ${EVIDENCE_INVESTIGATOR_MAX_COMPLETION_TOKENS:-768}
      EVIDENCE_INVESTIGATOR_MAX_RESPONSE_BYTES: ${EVIDENCE_INVESTIGATOR_MAX_RESPONSE_BYTES:-64000}
      EVIDENCE_INVESTIGATOR_TOP_K: ${EVIDENCE_INVESTIGATOR_TOP_K:-6}
      EVIDENCE_INVESTIGATOR_BRANCH_LIMIT: ${EVIDENCE_INVESTIGATOR_BRANCH_LIMIT:-30}
      EVIDENCE_INVESTIGATOR_EMBEDDING_MAX_INPUT_CHARS: ${EVIDENCE_INVESTIGATOR_EMBEDDING_MAX_INPUT_CHARS:-250000}
