services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://loreguard:loreguard@postgres:5432/loreguard
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENABLE_MODEL_EXTRACTION: ${ENABLE_MODEL_EXTRACTION:-false}
      MODEL_CHUNK_MAX_CHARS: ${MODEL_CHUNK_MAX_CHARS:-6000}
      MODEL_CHUNK_OVERLAP_LINES: ${MODEL_CHUNK_OVERLAP_LINES:-1}
      MODEL_MAX_CHUNKS_PER_DOCUMENT: ${MODEL_MAX_CHUNKS_PER_DOCUMENT:-24}
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://loreguard:loreguard@postgres:5432/loreguard
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENABLE_MODEL_EXTRACTION: ${ENABLE_MODEL_EXTRACTION:-false}
      MODEL_CHUNK_MAX_CHARS: ${MODEL_CHUNK_MAX_CHARS:-6000}
      MODEL_CHUNK_OVERLAP_LINES: ${MODEL_CHUNK_OVERLAP_LINES:-1}
      MODEL_MAX_CHUNKS_PER_DOCUMENT: ${MODEL_MAX_CHUNKS_PER_DOCUMENT:-24}
    depends_on: [postgres, redis]
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: loreguard, POSTGRES_USER: loreguard, POSTGRES_PASSWORD: loreguard}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
volumes: {postgres_data: {}}
