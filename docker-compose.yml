services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://loreguard:loreguard@postgres:5432/loreguard
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://loreguard:loreguard@postgres:5432/loreguard
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENABLE_MODEL_EXTRACTION: ${ENABLE_MODEL_EXTRACTION:-false}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-unspecified}
      EMBEDDING_DEPLOYMENT_FINGERPRINT: ${EMBEDDING_DEPLOYMENT_FINGERPRINT:-unspecified}
      EMBEDDING_PROFILE_NAMESPACE: ${EMBEDDING_PROFILE_NAMESPACE:-default}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_ALLOW_INSECURE_HTTP: ${EMBEDDING_ALLOW_INSECURE_HTTP:-false}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-2}
      EMBEDDING_TOTAL_DEADLINE_SECONDS: ${EMBEDDING_TOTAL_DEADLINE_SECONDS:-20}
      EMBEDDING_MAX_RESPONSE_BYTES: ${EMBEDDING_MAX_RESPONSE_BYTES:-4194304}
      EMBEDDING_BATCH_MAX_ITEMS: ${EMBEDDING_BATCH_MAX_ITEMS:-64}
      EMBEDDING_BATCH_MAX_CHARS: ${EMBEDDING_BATCH_MAX_CHARS:-120000}
      ENABLE_ISSUE_EVIDENCE_REVIEW: ${ENABLE_ISSUE_EVIDENCE_REVIEW:-false}
      ISSUE_EVIDENCE_REVIEW_MAX_ISSUES: ${ISSUE_EVIDENCE_REVIEW_MAX_ISSUES:-8}
      ISSUE_EVIDENCE_REVIEW_TOP_K: ${ISSUE_EVIDENCE_REVIEW_TOP_K:-6}
      ISSUE_EVIDENCE_REVIEW_BATCH_SIZE: ${ISSUE_EVIDENCE_REVIEW_BATCH_SIZE:-4}
      ISSUE_EVIDENCE_REVIEW_MAX_EVIDENCE_CHARS: ${ISSUE_EVIDENCE_REVIEW_MAX_EVIDENCE_CHARS:-6000}
      ISSUE_EVIDENCE_REVIEW_TOKEN_BUDGET: ${ISSUE_EVIDENCE_REVIEW_TOKEN_BUDGET:-6000}
      ISSUE_EVIDENCE_REVIEW_TIMEOUT_SECONDS: ${ISSUE_EVIDENCE_REVIEW_TIMEOUT_SECONDS:-20}
      ISSUE_EVIDENCE_REVIEW_TOTAL_DEADLINE_SECONDS: ${ISSUE_EVIDENCE_REVIEW_TOTAL_DEADLINE_SECONDS:-45}
      ISSUE_EVIDENCE_REVIEW_MAX_COMPLETION_TOKENS: ${ISSUE_EVIDENCE_REVIEW_MAX_COMPLETION_TOKENS:-1400}
      ISSUE_EVIDENCE_REVIEW_MAX_RESPONSE_BYTES: ${ISSUE_EVIDENCE_REVIEW_MAX_RESPONSE_BYTES:-64000}
      ISSUE_EVIDENCE_REVIEW_REQUIRE_HYBRID: ${ISSUE_EVIDENCE_REVIEW_REQUIRE_HYBRID:-true}
      ENABLE_EVIDENCE_INVESTIGATOR: ${ENABLE_EVIDENCE_INVESTIGATOR:-false}
      EVIDENCE_INVESTIGATOR_MAX_SEEDS: ${EVIDENCE_INVESTIGATOR_MAX_SEEDS:-1}
      EVIDENCE_INVESTIGATOR_MAX_DECISION_ROUNDS: ${EVIDENCE_INVESTIGATOR_MAX_DECISION_ROUNDS:-6}
      EVIDENCE_INVESTIGATOR_MAX_TOOL_CALLS: ${EVIDENCE_INVESTIGATOR_MAX_TOOL_CALLS:-6}
      EVIDENCE_INVESTIGATOR_MAX_SEARCHES: ${EVIDENCE_INVESTIGATOR_MAX_SEARCHES:-2}
      EVIDENCE_INVESTIGATOR_MAX_READS: ${EVIDENCE_INVESTIGATOR_MAX_READS:-2}
      EVIDENCE_INVESTIGATOR_MAX_RESULTS: ${EVIDENCE_INVESTIGATOR_MAX_RESULTS:-12}
      EVIDENCE_INVESTIGATOR_MAX_READ_LINES: ${EVIDENCE_INVESTIGATOR_MAX_READ_LINES:-12}
      EVIDENCE_INVESTIGATOR_MAX_SPAN_CHARS: ${EVIDENCE_INVESTIGATOR_MAX_SPAN_CHARS:-12000}
      EVIDENCE_INVESTIGATOR_TOKEN_BUDGET: ${EVIDENCE_INVESTIGATOR_TOKEN_BUDGET:-16000}
      EVIDENCE_INVESTIGATOR_MAX_PROMPT_BYTES: ${EVIDENCE_INVESTIGATOR_MAX_PROMPT_BYTES:-131072}
      EVIDENCE_INVESTIGATOR_TIMEOUT_SECONDS: ${EVIDENCE_INVESTIGATOR_TIMEOUT_SECONDS:-30}
      EVIDENCE_INVESTIGATOR_TOTAL_DEADLINE_SECONDS: ${EVIDENCE_INVESTIGATOR_TOTAL_DEADLINE_SECONDS:-60}
      EVIDENCE_INVESTIGATOR_MAX_COMPLETION_TOKENS: ${EVIDENCE_INVESTIGATOR_MAX_COMPLETION_TOKENS:-768}
      EVIDENCE_INVESTIGATOR_MAX_RESPONSE_BYTES: ${EVIDENCE_INVESTIGATOR_MAX_RESPONSE_BYTES:-64000}
      EVIDENCE_INVESTIGATOR_TOP_K: ${EVIDENCE_INVESTIGATOR_TOP_K:-6}
      EVIDENCE_INVESTIGATOR_BRANCH_LIMIT: ${EVIDENCE_INVESTIGATOR_BRANCH_LIMIT:-30}
      EVIDENCE_INVESTIGATOR_EMBEDDING_MAX_INPUT_CHARS: ${EVIDENCE_INVESTIGATOR_EMBEDDING_MAX_INPUT_CHARS:-250000}
      EVIDENCE_INVESTIGATOR_REQUIRE_HYBRID: ${EVIDENCE_INVESTIGATOR_REQUIRE_HYBRID:-true}
      ENABLE_REVIEW_AGENT: ${ENABLE_REVIEW_AGENT:-false}
      REVIEW_AGENT_MAX_DECISION_ROUNDS: ${REVIEW_AGENT_MAX_DECISION_ROUNDS:-2}
      REVIEW_AGENT_MAX_TOOL_CALLS: ${REVIEW_AGENT_MAX_TOOL_CALLS:-6}
      REVIEW_AGENT_MAX_SPAN_CHARS: ${REVIEW_AGENT_MAX_SPAN_CHARS:-4000}
      REVIEW_AGENT_MAX_SPAN_READS: ${REVIEW_AGENT_MAX_SPAN_READS:-40}
      REVIEW_AGENT_MAX_READ_REQUESTS_PER_ACTION: ${REVIEW_AGENT_MAX_READ_REQUESTS_PER_ACTION:-40}
      REVIEW_AGENT_MAX_READ_LINES: ${REVIEW_AGENT_MAX_READ_LINES:-12}
      REVIEW_AGENT_CONTEXT_RADIUS_LINES: ${REVIEW_AGENT_CONTEXT_RADIUS_LINES:-20}
      REVIEW_AGENT_TOKEN_BUDGET: ${REVIEW_AGENT_TOKEN_BUDGET:-8000}
      REVIEW_AGENT_TIMEOUT_SECONDS: ${REVIEW_AGENT_TIMEOUT_SECONDS:-15}
      REVIEW_AGENT_TOTAL_DEADLINE_SECONDS: ${REVIEW_AGENT_TOTAL_DEADLINE_SECONDS:-30}
      REVIEW_AGENT_MAX_COMPLETION_TOKENS: ${REVIEW_AGENT_MAX_COMPLETION_TOKENS:-}
      REVIEW_AGENT_MAX_RESPONSE_BYTES: ${REVIEW_AGENT_MAX_RESPONSE_BYTES:-64000}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-2}
      PROVIDER_THINKING_MODE: ${PROVIDER_THINKING_MODE:-}
      MODEL_CIRCUIT_BREAKER_FAILED_DOCUMENTS: ${MODEL_CIRCUIT_BREAKER_FAILED_DOCUMENTS:-1}
      MODEL_CHUNK_MAX_CHARS: ${MODEL_CHUNK_MAX_CHARS:-6000}
      MODEL_CHUNK_OVERLAP_LINES: ${MODEL_CHUNK_OVERLAP_LINES:-1}
      MODEL_MAX_CHUNKS_PER_DOCUMENT: ${MODEL_MAX_CHUNKS_PER_DOCUMENT:-24}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://loreguard:loreguard@postgres:5432/loreguard
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
