      MODEL_CHUNK_MAX_CHARS: ${MODEL_CHUNK_MAX_CHARS:-6000}
      MODEL_CHUNK_OVERLAP_LINES: ${MODEL_CHUNK_OVERLAP_LINES:-1}
      MODEL_MAX_CHUNKS_PER_DOCUMENT: ${MODEL_MAX_CHUNKS_PER_DOCUMENT:-24}
      DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-100000}
    volumes:
      - account_model_keys:/app/data/account-model-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: loreguard, POSTGRES_USER: loreguard, POSTGRES_PASSWORD: loreguard}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loreguard -d loreguard"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
volumes:
  postgres_data: {}
  account_model_keys: {}
